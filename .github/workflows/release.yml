name: release

# A chore(*): vX.Y.Z cap merged to main cuts the tag and publishes the Release
# from ekodb_client/CHANGELOG.md. The version is cross-checked against the
# Rust manifest, which `make sync-versions` keeps in step with the others.
#
# The cap must reach main with its subject intact: rebase-merge it (the
# convention here). A squash appends the PR number and a merge commit replaces
# the subject, and either makes the cap a silent, green no-op.

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  auto-tag:
    uses: ekoDB/ekodb-workflows-public/.github/workflows/auto-tag.yml@main
    with:
      version-command: grep -m1 '^version' ekodb_client/Cargo.toml | cut -d'"' -f2
      changelog: ekodb_client/CHANGELOG.md
